<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FreeFire Toolkit</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="github-container">
        <!-- GitHub Style Header -->
        <header class="github-header">
            <div class="header-left">
                <div class="github-logo">
                    <i class="fab fa-github"></i>
                    <span>FreeFire Toolkit</span>
                </div>
                <nav class="github-nav">
                    <a href="dashboard.html" class="nav-item active">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a href="#" class="nav-item" id="workbenchBtn">
                        <i class="fas fa-code"></i> Workbench
                    </a>
                    <a href="#" class="nav-item" id="modulesBtn">
                        <i class="fas fa-cubes"></i> Modules
                    </a>
                    <a href="#" class="nav-item" id="settingsBtn">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                </nav>
            </div>
            <div class="header-right">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search projects...">
                </div>
                <div class="notifications">
                    <i class="far fa-bell"></i>
                </div>
                <div class="user-dropdown">
                    <img src="https://avatars.githubusercontent.com/u/placeholder?v=4" alt="User" class="avatar">
                    <i class="fas fa-caret-down"></i>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="github-content">
            <!-- Sidebar -->
            <aside class="github-sidebar">
                <div class="user-info">
                    <img src="https://avatars.githubusercontent.com/u/placeholder?v=4" alt="User" class="avatar-large">
                    <h4 id="userName">User Name</h4>
                    <span class="user-role" id="userRole">Developer</span>
                </div>
                
                <div class="sidebar-section">
                    <h5>Repositories</h5>
                    <button class="sidebar-btn btn-primary" id="newProjectBtn">
                        <i class="fas fa-plus"></i> New Project
                    </button>
                </div>
                
                <div class="sidebar-section">
                    <h5>Recent Projects</h5>
                    <div class="project-list" id="projectList">
                        <!-- Projects will be loaded here -->
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h5>Statistics</h5>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">Projects</span>
                            <span class="stat-value" id="projectCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Pending</span>
                            <span class="stat-value pending" id="pendingCount">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Success</span>
                            <span class="stat-value success" id="successCount">0</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Panel -->
            <main class="github-main-panel">
                <!-- Dashboard Header -->
                <div class="dashboard-header">
                    <h2>Dashboard</h2>
                    <div class="dashboard-actions">
                        <button class="btn" id="refreshBtn">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                        <button class="btn btn-primary" id="createWorkbenchBtn">
                            <i class="fas fa-plus"></i> New Workbench
                        </button>
                    </div>
                </div>

                <!-- Projects Grid -->
                <div class="projects-grid" id="projectsGrid">
                    <!-- Projects will be loaded here -->
                </div>

                <!-- Recent Activity -->
                <div class="activity-section">
                    <h3>Recent Activity</h3>
                    <div class="activity-list" id="activityList">
                        <!-- Activities will be loaded here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Workbench Modal -->
    <div class="modal" id="workbenchModal">
        <div class="modal-content workbench-modal">
            <div class="modal-header">
                <h3>Create New Workbench</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="workbenchForm">
                    <div class="form-group">
                        <label>Route *</label>
                        <input type="text" id="route" placeholder="/MajorLogin" required>
                        <small class="form-text">Enter the API route</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Host *</label>
                        <input type="text" id="host" placeholder="example:PK" required>
                        <small class="form-text">Enter host information</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Bearer Token *</label>
                        <textarea id="bearerToken" rows="3" required></textarea>
                        <small class="form-text">Enter the bearer token</small>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>X-Vi-Version</label>
                            <select id="xVersion">
                                <option value="OB99">OB99</option>
                                <option value="OB98">OB98</option>
                                <option value="OB97">OB97</option>
                                <option value="OB96">OB96</option>
                                <option value="OB95">OB95</option>
                                <option value="OB94">OB94</option>
                                <option value="OB93">OB93</option>
                                <option value="OB92">OB92</option>
                                <option value="OB91">OB91</option>
                                <option value="OB90">OB90</option>
                                <option value="OB89">OB89</option>
                                <option value="OB88">OB88</option>
                                <option value="OB87">OB87</option>
                                <option value="OB86">OB86</option>
                                <option value="OB85">OB85</option>
                                <option value="OB84">OB84</option>
                                <option value="OB83">OB83</option>
                                <option value="OB82">OB82</option>
                                <option value="OB81">OB81</option>
                                <option value="OB80">OB80</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="projectName" placeholder="Project Name">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn" id="cancelBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="commitBtn">
                            <i class="fas fa-code-commit"></i> Commit
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/workbench.js"></script>
</body>
</html>
